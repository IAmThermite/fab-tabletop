name: Deploy to Fly.io

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    # disable deployment for now
    if: ${{ github.event.workflow_run.conclusion == 'success' && false }}
    steps:
      # The Dockerfile bundles `vendor/flesh-and-blood-cards/json/english/card.json`
      # into the release, so the submodule must be in the build context.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --config infrastructure/fly/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
