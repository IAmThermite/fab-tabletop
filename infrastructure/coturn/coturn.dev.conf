# coturn local-dev config, mounted by docker-compose (host networking).
#
# Mirrors the production REST-API auth scheme so the same Tabletop.Turn
# credential code path is exercised locally. The dev secret here must match
# config/dev.exs (`config :tabletop, Tabletop.Turn, secret: "dev_turn_secret"`).

use-auth-secret
static-auth-secret=dev_turn_secret

realm=localhost

listening-port=3478

# Deliberately narrower than production's 49160-49259: this runs with host
# networking on a developer machine, and one or two local calls never need
# more. Not a value to keep in sync with turnserver.conf.
min-port=49160
max-port=49169

fingerprint
no-multicast-peers

# No peer denylist here (unlike production): local dev needs to relay to
# 127.0.0.1 / the LAN to reach the Phoenix host and your phone.

# Verbose logging is useful locally.
verbose
