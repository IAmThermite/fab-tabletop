# coturn production config (Fly.io).
#
# The auth secret, external IP, realm and TLS cert are injected at container
# start by entrypoint.sh (via --static-auth-secret / --external-ip / --realm /
# --cert / --pkey) so no secret is baked into the image. Everything else here.
#
# The TLS listener is NOT configured here either — entrypoint.sh enables it on
# 443 when a cert is supplied and passes --no-tls/--no-dtls when one isn't, so
# there is never a half-configured listener failing to bind at boot.

# TURN REST API: clients authenticate with time-limited HMAC credentials
# minted by the app (Tabletop.Turn). The shared secret is passed at runtime.
use-auth-secret

# STUN/TURN listener (TCP + UDP).
listening-port=3478

# Relay port range handed out for UDP media. Every port here must also be
# published in infrastructure/coturn/fly.toml — Fly only routes ports it knows
# about — so keep the two in sync (fly.toml uses a single start_port/end_port
# range covering exactly this span).
#
# Budget one port per allocation. A relayed player costs one allocation, and
# the phone-as-camera flow is a second peer connection, so a fully-relayed game
# with both players on phones costs 4. 100 ports leaves comfortable headroom
# for a community beta.
min-port=49160
max-port=49259

fingerprint
no-multicast-peers
# No `no-cli` here: it is deprecated in coturn 4.x (it logs "no-cli option is
# deprecated, see --cli") and the telnet CLI is off unless --cli is passed, so
# omitting it is both correct and quieter than setting a deprecated flag.

# --- Peer denylist (SSRF guard) ---
# A TURN server will relay to whatever peer address a client asks for, so an
# open one is a proxy into whatever it can reach. On Fly that includes the 6PN
# private network (fdaa::/16) where Postgres lives, so this is not theoretical.
#
# `no-loopback-peers` used to cover part of this but was removed in coturn 4.x
# — it is silently ignored ("Bad configuration format") and must not be relied
# on. These explicit ranges are the supported replacement.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- Abuse / cost guards (a bug or abuse can't run up the Fly bandwidth bill) ---
# Max simultaneous allocations across the whole server. The relay port range
# above is the real hard cap (one UDP relay port per allocation), so this is
# set to match it — a higher number would be unreachable and would just mean
# allocations failed on port exhaustion instead of on a quota with a clear log
# line. Widen both together.
total-quota=100
# Max simultaneous allocations per user. coturn keys this on the literal REST
# username, so Tabletop.Turn deliberately quantises the expiry it embeds
# (see the @window comment there) — otherwise every page load would mint a
# fresh username and the quota would never bind to a real person.
user-quota=6
# Per-allocation bandwidth cap (bytes/sec). 0 = unlimited; cap to ~1MB/s.
max-bps=1000000

# Log to stdout so `fly logs` shows allocation failures. `simple-log` disables
# the PID/date filename rollover, which is meaningless for a stdout stream.
log-file=stdout
simple-log
