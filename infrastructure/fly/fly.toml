# fly.toml app configuration file generated for fabtabletop on 2026-04-10T14:19:03+12:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fabtabletop'
primary_region = 'iad'

[deploy]
  release_command = '/app/bin/migrate'

[build]
  dockerfile = '../Dockerfile'

[env]
  ECTO_IPV6 = 'true'
  PHX_HOST = 'fabtabletop.net'
  PHX_SERVER = 'true'
  PORT = '4000'
  OTEL_BSP_SCHEDULE_DELAY_MILLIS = '1000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

# Prometheus scrape target. Fly polls this every 15s over the private 6PN
# network and stores the result in its managed Prometheus, queryable at
# https://api.fly.io/prometheus/<org-slug>/ from any Grafana instance.
#
# Deliberately NOT part of [http_service] — the port is unreachable from the
# public internet, so the metrics need no auth of their own. Served by
# Tabletop.PromEx.MetricsServer; keep in sync with :metrics_port in runtime.exs.
[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
